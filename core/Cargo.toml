[package]
name = "headroom-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "Headroom's core: scan, reclaim, history, autopilot, CLI and MCP server"
publish = false

# No dependencies on purpose (docs/THREAT-MODEL.md, "Supply chain"): JSON, SHA-256 and the
# few macOS calls we need are written here.

[lib]
name = "headroom_core"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "headroom"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
