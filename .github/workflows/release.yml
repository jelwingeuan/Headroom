name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: macos-15 # arm64; bundle.sh builds both architectures
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build universal DMG
        env:
          HEADROOM_VERSION: ${{ github.ref_name }}
        run: bash scripts/bundle.sh --dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmg
          path: |
            build/Headroom_universal.dmg
            build/Headroom_universal.dmg.sha256
          if-no-files-found: error

  publish:
    # Only this job can write: it never runs the build, it attests and publishes its output.
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dmg
      - name: Check the checksum
        run: sha256sum -c Headroom_universal.dmg.sha256
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: Headroom_universal.dmg
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: Headroom ${{ github.ref_name }}
          draft: false
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            Headroom_universal.dmg
            Headroom_universal.dmg.sha256
